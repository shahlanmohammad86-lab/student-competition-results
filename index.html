<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Competition Results</title>
<style>
:root{--bg:#090d18;--panel:#121a2b;--line:#26334a;--text:#f1f5ff;--muted:#9baac2;--blue:#6485ff;--green:#36d6a0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
header{padding:22px 18px;background:#10182a;border-bottom:1px solid var(--line)}
header h1{font-size:23px;margin:0 0 7px}
header p{margin:0;color:var(--muted);font-size:13px}
main{max-width:1100px;margin:auto;padding:18px}
nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:16px}
button{border:1px solid var(--line);background:#182238;color:var(--text);padding:11px 14px;border-radius:9px;cursor:pointer;font-weight:600}
button.active,button.primary{background:var(--blue);color:white;border-color:var(--blue)}
button.danger{background:#401e2b;border-color:#703047}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px}
.card,.panel{background:var(--panel);border:1px solid var(--line);padding:17px;border-radius:13px;margin-bottom:15px;min-width:0}
.card span{color:var(--muted);font-size:12px}
.card strong{display:block;font-size:28px;margin-top:9px}
h2{font-size:19px;margin:0 0 15px}
h3{font-size:15px}
label{display:block;color:var(--muted);font-size:13px;margin:12px 0 6px}
input,select{width:100%;padding:12px;background:#0b1220;color:var(--text);border:1px solid var(--line);border-radius:8px;font-size:15px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.full{grid-column:1/-1}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.page{display:none}.page.show{display:block}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:12px 9px;border-bottom:1px solid var(--line)}
th{color:var(--muted)}
